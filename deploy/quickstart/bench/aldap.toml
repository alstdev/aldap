# ALDAP quick start against the Samba AD test bench (compose.bench.yml):
# config/aldap.toml with the bench directory (deploy/samba-dc/provision.ldif).

[server]
log_format = "json"

[tls]
mode      = "builtin-ca"
ca_dir    = "/var/lib/aldap/ca"
auto_init = true
san       = ["localhost", "127.0.0.1"]

[upstream.ad]
servers            = ["ldaps://dc1:636", "ldaps://dc2:636"]
tls_ca_file        = "/etc/aldap-bench/ca.pem"            # testdata/samba-ca.pem (init.sh)
bind_dn            = "CN=svc-aldap,CN=Users,DC=test,DC=aldap"
bind_password_file = "/run/secrets/ad_pass"
base_dn            = "DC=test,DC=aldap"

[profile.virola]
listen       = [":636"]
transport    = "ldaps"
upstream     = "ad"
virtual_base = "ou=virola,dc=aldap"
bases        = ["OU=Office,DC=test,DC=aldap", "OU=Branch,DC=test,DC=aldap"]
filter       = "(&(objectCategory=person)(objectClass=user)(!(userAccountControl:1.2.840.113556.1.4.803:=2)))"
rdn_attr     = "sAMAccountName"

[profile.virola.client_bind]
dn            = "cn=virola,ou=services,dc=aldap"
password_file = "/run/secrets/virola_bind"

[profile.virola.user_bind]
default_domain = "test.aldap"

[profile.virola.attrs]
allow = ["userPrincipalName", "sAMAccountName", "displayName", "mail", "memberOf", "objectClass", "objectGUID"]

[profile.virola.attrs.map]
uid = "sAMAccountName"
cn  = "displayName"

[profile.virola.groups.virola-users]
description = "Everyone the profile exports"
objectclass = "groupOfNames"
