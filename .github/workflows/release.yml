name: release

# A tag v* publishes: binaries (linux/amd64, linux/arm64, windows/amd64; aldap
# and aldapctl), SHA256SUMS, a CycloneDX SBOM, keyless cosign signatures, the
# DHI image ghcr.io/alstdev/aldap and a GitHub Release with the CHANGELOG
# section of the version (docs/release.md).
# workflow_dispatch and pull requests that touch the release files run the same
# jobs as a dry run: everything is built, nothing is pushed, signed or released.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release-notes.sh
      - build.sh
      - Dockerfile

permissions:
  contents: read

env:
  GOTOOLCHAIN: auto
  IMAGE: ghcr.io/alstdev/aldap

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = push ] && [[ "$REF" == refs/tags/v* ]]; then
            { echo "publish=true"; echo "version=${REF_NAME}"; echo "notes=${REF_NAME}"; } >> "$GITHUB_OUTPUT"
          else
            { echo "publish=false"; echo "version=v0.0.0-dryrun.${SHA::12}"; echo "notes=Unreleased"; } >> "$GITHUB_OUTPUT"
            echo "::notice::dry run (${EVENT}): nothing is pushed, signed or released"
          fi

  # A tag can point at any commit: re-run the unit tests and the Samba bench.
  verify:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod, cache: true }
      - run: go vet ./... && make test

  samba:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/samba.yml

  binaries:
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod, cache: true }
      - name: Release notes from CHANGELOG.md
        run: scripts/release-notes.sh "${{ needs.plan.outputs.notes }}" > release-notes.md
      - run: mkdir -p dist
      # Before the build, so the SBOM describes the source modules only.
      - name: SBOM (CycloneDX, Go modules of the source)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/aldap_${{ needs.plan.outputs.version }}_sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - run: make build VERSION=${{ needs.plan.outputs.version }}
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: |
            dist/
            release-notes.md

  image:
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
      DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
    steps:
      - name: DHI credentials
        id: dhi
        run: |
          if [ -n "$DHI_USERNAME" ] && [ -n "$DHI_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [ "$PUBLISH" = true ]; then
            echo "::error::DHI_USERNAME/DHI_TOKEN secrets not set: the release image cannot be built"; exit 1
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DHI_USERNAME/DHI_TOKEN secrets not set, DHI image skipped in the dry run"
          fi
      - uses: actions/checkout@v4
        if: steps.dhi.outputs.ok == 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.dhi.outputs.ok == 'true'
        with: { driver: docker }
      - uses: docker/login-action@v4
        if: steps.dhi.outputs.ok == 'true'
        with: { registry: dhi.io, username: "${{ env.DHI_USERNAME }}", password: "${{ env.DHI_TOKEN }}" }
      - uses: docker/login-action@v4
        if: steps.dhi.outputs.ok == 'true' && env.PUBLISH == 'true'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: anchore/sbom-action/download-syft@v0
        if: steps.dhi.outputs.ok == 'true'
      - uses: sigstore/cosign-installer@v4.1.2   # no floating v4 tag
        if: steps.dhi.outputs.ok == 'true' && env.PUBLISH == 'true'
      - name: Build (push and sign keyless on a tag)
        if: steps.dhi.outputs.ok == 'true'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          if [ "$PUBLISH" = true ]; then
            PUSH=1 COSIGN_KEYLESS=1 ./build.sh --dhi
          else
            NO_SIGN=1 ./build.sh --dhi
          fi
      - uses: actions/upload-artifact@v4
        if: steps.dhi.outputs.ok == 'true'
        with: { name: image-sbom, path: "dist/sbom-*.cdx.json" }

  release:
    needs: [plan, verify, samba, binaries, image]
    # verify and samba are skipped in a dry run.
    if: always() && needs.binaries.result == 'success' && needs.image.result == 'success' && (needs.plan.outputs.publish != 'true' || (needs.verify.result == 'success' && needs.samba.result == 'success'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    env:
      PUBLISH: ${{ needs.plan.outputs.publish }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: release-dist }
      - uses: actions/download-artifact@v4
        continue-on-error: true   # absent in a dry run without DHI secrets
        with: { name: image-sbom, path: dist/ }
      - uses: sigstore/cosign-installer@v4.1.2
        if: env.PUBLISH == 'true'
      - name: Sign checksums (keyless)
        if: env.PUBLISH == 'true'
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Dry run summary
        if: env.PUBLISH != 'true'
        run: |
          {
            echo "## Release dry run ${{ needs.plan.outputs.version }}"
            echo; echo '```'; ls -l dist/; echo '```'
            echo; echo "### Notes (CHANGELOG [Unreleased], first 40 lines)"; head -n 40 release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: softprops/action-gh-release@v3
        if: env.PUBLISH == 'true'
        with:
          files: dist/*
          body_path: release-notes.md
          fail_on_unmatched_files: true
