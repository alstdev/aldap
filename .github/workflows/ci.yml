name: ci

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  GOTOOLCHAIN: auto

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - uses: golangci/golangci-lint-action@v8
        with: { version: latest }
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: make licenses
      - run: git diff --exit-code THIRD_PARTY_LICENSES.md
      - run: sudo apt-get install -y shellcheck && make shellcheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: sudo apt-get update && sudo apt-get install -y ldap-utils
      - run: make test
      - run: make integration
      - run: go test -run TestNoSecretsInOutput -tags integration ./...
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-artifacts, path: artifacts/ }

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: make build
      - uses: actions/upload-artifact@v4
        with: { name: binaries, path: dist/ }

  docker-plain:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: NO_SIGN=1 ./build.sh --plain

  fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: |
          go test -run=^$ -fuzz=FuzzParseFilter -fuzztime=10m ./internal/ldapfilter/
          go test -run=^$ -fuzz=FuzzParseDN -fuzztime=10m ./internal/ldapfilter/

  samba:
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: make integration-samba
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: samba-logs, path: artifacts/ }

  docker-dhi:
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [lint, test]
    env:
      DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to dhi.io
        if: env.DHI_USERNAME != ''
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ env.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}
      - name: Build DHI image
        if: env.DHI_USERNAME != ''
        run: NO_SIGN=1 ./build.sh --dhi
      - name: Skipped
        if: env.DHI_USERNAME == ''
        run: echo "::warning::DHI_USERNAME/DHI_TOKEN secrets not set, DHI build skipped"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build, docker-plain]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: binaries, path: dist/ }
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - name: Sign checksums (keyless)
        run: cosign sign-blob --yes dist/SHA256SUMS --output-signature dist/SHA256SUMS.sig --output-certificate dist/SHA256SUMS.pem
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
