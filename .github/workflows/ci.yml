name: ci

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

# Runner pinned to ubuntu-24.04 while ubuntu-latest migrates to Ubuntu 26
# (docs/DECISIONS.md 2026-10-19); setup-go@v6 installs the go.mod `toolchain`
# version, so GOTOOLCHAIN never downloads a second toolchain into the cache.
permissions:
  contents: read

env:
  GOTOOLCHAIN: auto

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod, cache: true }
      - uses: golangci/golangci-lint-action@v8
        with: { version: latest }
      - run: go vet ./...
      - run: make vuln
      - run: make licenses
      - run: git diff --exit-code THIRD_PARTY_LICENSES.md
      - run: sudo apt-get install -y shellcheck && make shellcheck

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod, cache: true }
      - run: sudo apt-get update && sudo apt-get install -y ldap-utils
      - run: python3 -m pip install --user ldap3   # TESTING.md 48 (TestDaemon_Ldap3 skips without it)
      - run: make test
      - run: make integration
      - run: go test -run TestNoSecretsInOutput -tags integration ./...
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-artifacts, path: artifacts/ }

  build:
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod, cache: true }
      - run: make build
      - uses: actions/upload-artifact@v4
        with: { name: binaries, path: dist/ }

  docker-plain:
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: NO_SIGN=1 ./build.sh --plain

  fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod, cache: true }
      - run: |
          go test -run=^$ -fuzz=FuzzParseFilter -fuzztime=10m ./internal/ldapfilter/
          go test -run=^$ -fuzz=FuzzParseDN -fuzztime=10m ./internal/ldapfilter/
          go test -run=^$ -fuzz=FuzzParseMessage -fuzztime=10m ./internal/listener/

  samba:
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The Samba AD test bench arrives with Stage 13; until deploy/samba-dc/compose.yml
      # exists the remaining steps are skipped (hashFiles is a step-level function).
      - id: bench
        run: echo "present=${{ hashFiles('deploy/samba-dc/compose.yml') != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.bench.outputs.present == 'true'
        uses: actions/setup-go@v6
        with: { go-version-file: go.mod, cache: true }
      - if: steps.bench.outputs.present == 'true'
        run: make integration-samba
      - if: steps.bench.outputs.present == 'true' && always()
        uses: actions/upload-artifact@v4
        with: { name: samba-logs, path: artifacts/ }
      - if: steps.bench.outputs.present != 'true'
        run: echo "::warning::deploy/samba-dc/compose.yml not found, Samba integration skipped (Stage 13)"

  docker-dhi:
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: [lint, test]
    env:
      DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to dhi.io
        if: env.DHI_USERNAME != ''
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ env.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}
      - name: Build DHI image
        if: env.DHI_USERNAME != ''
        run: NO_SIGN=1 ./build.sh --dhi
      - name: Skipped
        if: env.DHI_USERNAME == ''
        run: echo "::warning::DHI_USERNAME/DHI_TOKEN secrets not set, DHI build skipped"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: [build, docker-plain]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: binaries, path: dist/ }
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - name: Sign checksums (keyless)
        run: cosign sign-blob --yes dist/SHA256SUMS --output-signature dist/SHA256SUMS.sig --output-certificate dist/SHA256SUMS.pem
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
