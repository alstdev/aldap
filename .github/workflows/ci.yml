name: ci

# One run per commit: branches other than main are tested through their pull
# request only (docs/DECISIONS.md 2026-10-23 «Actions minutes»).
# Samba AD runs in samba.yml, releases in release.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

# Runner pinned to ubuntu-24.04 while ubuntu-latest migrates to Ubuntu 26
# (docs/DECISIONS.md 2026-10-19); setup-go@v6 installs the go.mod `toolchain`
# version, so GOTOOLCHAIN never downloads a second toolchain into the cache.
permissions:
  contents: read

env:
  GOTOOLCHAIN: auto

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: { go-version-file: go.mod, cache: true }
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with: { version: latest }
      - run: go vet ./...
      # aldapctl for windows/amd64: build, vet and test compilation (named pipe client).
      - run: make windows-ctl
      - run: make vuln
      - run: make licenses
      - run: git diff --exit-code THIRD_PARTY_LICENSES.md
      - run: sudo apt-get install -y shellcheck && make shellcheck

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: { go-version-file: go.mod, cache: true }
      - run: sudo apt-get update && sudo apt-get install -y ldap-utils
      - run: python3 -m pip install --user ldap3   # TESTING.md 48 (TestDaemon_Ldap3 skips without it)
      - run: make test
      - run: make integration
      - run: go test -run TestNoSecretsInOutput -tags integration ./...
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: test-artifacts, path: artifacts/ }

  build:
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: { go-version-file: go.mod, cache: true }
      - run: make build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: binaries, path: dist/ }

  docker-plain:
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: NO_SIGN=1 ./build.sh --plain

  fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: { go-version-file: go.mod, cache: true }
      # 2 minutes per target daily, 10 minutes on Sundays (UTC).
      - run: |
          t=2m; [ "$(date -u +%u)" = 7 ] && t=10m
          echo "fuzztime $t"
          go test -run=^$ -fuzz=FuzzParseFilter -fuzztime=$t ./internal/ldapfilter/
          go test -run=^$ -fuzz=FuzzParseDN -fuzztime=$t ./internal/ldapfilter/
          go test -run=^$ -fuzz=FuzzParseMessage -fuzztime=$t ./internal/listener/

  # Release images are built by release.yml (same build.sh --dhi).
  docker-dhi:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    needs: [lint, test]
    env:
      DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to dhi.io
        if: env.DHI_USERNAME != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: dhi.io
          username: ${{ env.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}
      - name: Build DHI image
        if: env.DHI_USERNAME != ''
        run: NO_SIGN=1 ./build.sh --dhi
      - name: Skipped
        if: env.DHI_USERNAME == ''
        run: echo "::warning::DHI_USERNAME/DHI_TOKEN secrets not set, DHI build skipped"
