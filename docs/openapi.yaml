openapi: 3.1.0
info:
  title: ALDAP Management API
  version: "1.0"
  license: { name: MIT }
  description: |
    Bearer tokens ([[api.token]]) carry scopes; admin implies every scope. The IPC
    socket ([server].ipc_socket, unix 0600) needs no token and acts as admin.
    Every call to a locks:write or admin endpoint, refused ones included, emits
    api_call{method, path, token_name, client_ip, status}. Errors are {error, code}.
    401 (no or unknown token), 403 (insufficient_scope, forbidden_source) and
    429 (rate_limit_rps per client address) apply to every non-public operation.
servers:
  - url: https://127.0.0.1:8636
security:
  - bearer: []
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
  schemas:
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string }
    Lock:
      type: object
      required: [target, key, until, source]
      properties:
        target: { type: string, enum: [ip, account] }
        key: { type: string }
        until: { type: string, format: date-time }
        failures: { type: integer }
        source: { type: string, enum: [ratelimit, ids, api, honeytoken, tui] }
        reason: { type: string }
        profile: { type: string }
    LockRequest:
      type: object
      required: [target, key]
      properties:
        target: { type: string, enum: [ip, account] }
        key: { type: string }
        duration: { type: string, description: "Go duration, default 15m, at most 8760h" }
        reason: { type: string, maxLength: 512 }
    Indicator:
      type: object
      required: [target, key, score, reasons, first_seen, last_seen]
      properties:
        target: { type: string, enum: [ip, account] }
        key: { type: string }
        score: { type: number }
        reasons: { type: array, items: { type: string } }
        hits: { type: object, additionalProperties: { type: integer } }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        locked: { type: boolean }
    Event:
      $ref: "./events.schema.json"
    UpstreamServer:
      type: object
      properties:
        url: { type: string }
        state: { type: string, enum: [up, down, unknown] }
        consecutive_failures: { type: integer }
        last_error: { type: string }
        latency_p50_ms: { type: number }
        latency_p95_ms: { type: number }
    Status:
      type: object
      properties:
        version: { type: string }
        go_version: { type: string, description: "Go runtime of the daemon (runtime.Version)" }
        uptime_s: { type: integer }
        lockdown: { type: boolean }
        learning: { type: boolean }
        events_seq: { type: integer }
        profiles: { type: array, items: { type: string } }
        upstreams:
          type: object
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/UpstreamServer" }
        locks_active: { type: integer }
        attacks_active: { type: integer }
    TestRequest:
      type: object
      required: [base, filter]
      properties:
        base: { type: string }
        scope: { type: string, enum: [base, one, sub], default: sub }
        filter: { type: string }
        attrs: { type: array, items: { type: string } }
        size_limit: { type: integer, minimum: 0 }
    TestResponse:
      type: object
      properties:
        result_code: { type: integer }
        entries:
          type: array
          items:
            type: object
            properties:
              dn: { type: string }
              attrs: { type: object, additionalProperties: { type: array, items: { type: string } } }
        denied_attrs: { type: array, items: { type: string } }
        denied_terms: { type: array, items: { type: string } }
        upstream_queries: { type: integer, description: directory searches run }
        effective_filter: { type: string, description: filter sent to the upstream }
        post_filter: { type: string, description: part evaluated locally }
        honeytoken: { type: string }
        duration_ms: { type: number }
    ApplyResult:
      type: object
      properties:
        ok: { type: boolean }
        dry_run: { type: boolean, description: "true when the body was only validated" }
        backup: { type: string, description: "path of aldap.toml.bak.<ts>" }
  responses:
    Err:
      description: Error
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

paths:
  /healthz:
    get:
      security: []
      responses: { "200": { description: alive } }
  /readyz:
    get:
      security: []
      responses: { "200": { description: ready }, "503": { description: not ready } }
  /metrics:
    get:
      x-scope: status:read
      description: Prometheus metrics. Requires status:read unless api.metrics.public=true; 404 with api.metrics.enabled=false.
      responses: { "200": { description: text/plain exposition }, "404": { $ref: "#/components/responses/Err" } }
  /v1/status:
    get:
      x-scope: status:read
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } } }
  /v1/upstreams:
    get:
      x-scope: status:read
      responses: { "200": { description: OK } }
  /v1/profiles:
    get:
      x-scope: status:read
      responses: { "200": { description: profiles without secrets } }
  /v1/locks:
    get:
      x-scope: locks:read
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Lock" } } } } }
    post:
      x-scope: locks:write
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LockRequest" } } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/Lock" } } } }
        "400": { $ref: "#/components/responses/Err" }
        "503": { $ref: "#/components/responses/Err" }
  /v1/locks/{target}/{key}:
    delete:
      x-scope: locks:write
      parameters:
        - { name: target, in: path, required: true, schema: { type: string, enum: [ip, account] } }
        - { name: key, in: path, required: true, schema: { type: string } }
      responses: { "204": { description: unlocked }, "400": { $ref: "#/components/responses/Err" }, "404": { $ref: "#/components/responses/Err" } }
  /v1/indicators:
    get:
      x-scope: locks:read
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [json, stix-lite, plain], default: json } }
        - { name: min_score, in: query, schema: { type: number, minimum: 0 } }
      description: |
        json — array of Indicator; stix-lite — STIX 2.1 bundle of indicator objects only
        (deterministic ids, confidence = min(100, score)); plain — tab-separated
        "target key score reasons locked" lines with a comment header.
      responses:
        "200":
          description: OK
          content:
            application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Indicator" } } }
            text/plain: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Err" }
  /v1/events:
    get:
      x-scope: events:read
      parameters:
        - { name: since, in: query, schema: { type: integer }, description: "seq, exclusive" }
        - { name: limit, in: query, schema: { type: integer, default: 1000, maximum: 10000 } }
        - { name: types, in: query, schema: { type: string }, description: "comma-separated event types" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Event" } } } } }
        "400": { $ref: "#/components/responses/Err" }
  /v1/events/stream:
    get:
      x-scope: events:read
      description: |
        Server-Sent Events: "id: <seq>", "event: <type>", "data: <record JSON>"; a ": ping"
        comment every 15 s. Resumes after Last-Event-ID (= seq) or ?since=, from the ring buffer;
        without either the stream starts with the last 1000 buffered records. At most
        api.max_streams (default 64) streams are open at once; further requests get 503
        too_many_streams.
      parameters:
        - { name: Last-Event-ID, in: header, schema: { type: integer } }
        - { name: since, in: query, schema: { type: integer } }
        - { name: types, in: query, schema: { type: string } }
      responses: { "200": { description: text/event-stream }, "400": { $ref: "#/components/responses/Err" }, "503": { $ref: "#/components/responses/Err" } }
  /v1/lockdown:
    post:
      x-scope: locks:write
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [state], properties: { state: { type: string, enum: [on, off] } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { lockdown: { type: boolean }, source: { type: string } } } } } }
        "400": { $ref: "#/components/responses/Err" }
  /v1/config:
    get:
      x-scope: admin
      responses: { "200": { description: "TOML with secrets masked", content: { application/toml: {} } } }
    put:
      x-scope: admin
      description: |
        Validated in memory first (400, file untouched). Then the previous file is copied
        to aldap.toml.bak.<ts>, the new one written atomically (.tmp + rename) and reloaded;
        when the reload fails the previous file is restored and the running configuration kept.
        With dry_run=true the body is only validated (no backup, no write, no reload).
        An inline secret equal to the masked placeholder "***" of GET /v1/config is refused (400).
        409 no_config_file when the configuration comes from the environment only; 409
        config_read_only when the file cannot be written (read-only mount, docs/podman.md).
      parameters: [{ name: dry_run, in: query, schema: { type: boolean, default: false } }]
      requestBody: { required: true, content: { application/toml: {} } }
      responses:
        "200": { description: applied (or valid with dry_run), content: { application/json: { schema: { $ref: "#/components/schemas/ApplyResult" } } } }
        "400": { $ref: "#/components/responses/Err" }
        "409": { $ref: "#/components/responses/Err" }
        "413": { $ref: "#/components/responses/Err" }
        "500": { $ref: "#/components/responses/Err" }
  /v1/reload:
    post:
      x-scope: admin
      responses: { "200": { description: reloaded }, "400": { $ref: "#/components/responses/Err" }, "500": { $ref: "#/components/responses/Err" } }
  /v1/profiles/{name}/sync:
    post:
      x-scope: admin
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      description: Asks the replica for a sync now (the outcome is the replica_synced or replica_sync_failed event); 409 for a profile without cache.mode = replica.
      responses: { "202": { description: sync started }, "404": { $ref: "#/components/responses/Err" }, "409": { $ref: "#/components/responses/Err" } }
  /v1/profiles/{name}/record:
    post:
      x-scope: admin
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      description: |
        Starts or stops recording the client searches of the profile to record.file (JSON lines in the
        format of aldapctl replay, mode 0600, rotated by record.max_size_mb / record.max_files). The
        state lasts until the process exits or [profile.<name>.record] changes; record.enabled is the
        state at start. 409 no_record_file when record.file is not set.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [state], properties: { state: { type: string, enum: ["on", "off"] } } } } } }
      responses:
        "200": { description: recording state, content: { application/json: { schema: { type: object, properties: { record: { type: string, enum: ["on", "off"] } } } } } }
        "400": { $ref: "#/components/responses/Err" }
        "404": { $ref: "#/components/responses/Err" }
        "409": { $ref: "#/components/responses/Err" }
        "500": { $ref: "#/components/responses/Err" }
  /v1/profiles/{name}/test:
    post:
      x-scope: admin
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TestRequest" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TestResponse" } } } }
        "400": { $ref: "#/components/responses/Err" }
        "404": { $ref: "#/components/responses/Err" }
  /v1/baseline/{profile}/learn:
    post:
      x-scope: admin
      parameters: [{ name: profile, in: path, required: true, schema: { type: string } }]
      description: Restarts baseline learning; the baseline window is process-wide (all profiles).
      requestBody: { content: { application/json: { schema: { type: object, properties: { duration: { type: string, description: "default 24h, at most 720h" } } } } } }
      responses: { "202": { description: learning }, "400": { $ref: "#/components/responses/Err" }, "404": { $ref: "#/components/responses/Err" } }
